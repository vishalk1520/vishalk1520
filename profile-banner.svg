<path d="M0 270H1200" stroke="url(#line)" stroke-width="1"/>
<text x="74" y="82" fill="#a7b0bd" font-family="monospace" font-size="15" letter-spacing="4">VISHAL KANOJIYA / PORTFOLIO</text>
<text x="70" y="166" fill="#f2f4f7" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" letter-spacing="-2">Building systems.</text>
<text x="74" y="211" fill="#aeb7c4" font-family="Arial, Helvetica, sans-serif" font-size="25">Learning by shipping real projects.</text>
<text x="75" y="284" fill="#8993a1" font-family="monospace" font-size="14" letter-spacing="2">JAVA · PYTHON · BACKEND · APPLIED AI</text>
