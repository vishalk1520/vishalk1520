<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
<title id="title">Vishal Kanojiya — Software Engineer in the making</title>
<desc id="desc">Minimal dark banner with abstract terminal-inspired geometry and the initials VK.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090b10"/><stop offset="1" stop-color="#171b23"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".055" stroke-width="1"/></pattern>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7d8795" stop-opacity="0"/><stop offset=".5" stop-color="#aeb7c4" stop-opacity=".65"/><stop offset="1" stop-color="#7d8795" stop-opacity="0"/></linearGradient>
</defs>
<rect width="1200" height="320" rx="22" fill="url(#bg)"/>
<rect width="1200" height="320" rx="22" fill="url(#grid)"/>
<circle cx="1030" cy="152" r="155" fill="none" stroke="#c3ccd8" stroke-opacity=".12"/>
